name: Build local Arabic TTS assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-tts-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone and build the official Nabra TTS source (browser-local runtime)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          git clone --depth 1 https://github.com/Oddadmix/nabra-tts.git .build/nabra-tts
          npm --prefix .build/nabra-tts ci
          npm --prefix .build/nabra-tts run build
          test -s .build/nabra-tts/dist/index.js

      - name: Bundle TTS locally and copy ONNX WASM runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/ort
          .build/nabra-tts/node_modules/.bin/esbuild .build/nabra-tts/dist/index.js \
            --bundle --format=esm --platform=browser --target=es2022 \
            --external:react --external:module --external:node:* --external:fs --external:path --external:url --external:worker_threads --external:crypto --outfile=vendor/nabra-tts.bundle.js
          ORT_DIST=.build/nabra-tts/node_modules/onnxruntime-web/dist
          # The bundled ONNX Runtime Web build has JSEP enabled, which supports
          # WebGPU and its WASM fallback. Only its matching loader/binary pair is needed.
          cp -f "$ORT_DIST/ort-wasm-simd-threaded.jsep.mjs" "$ORT_DIST/ort-wasm-simd-threaded.jsep.wasm" vendor/ort/
          find vendor/ort -maxdepth 1 -type f \
            ! -name 'ort-wasm-simd-threaded.jsep.mjs' \
            ! -name 'ort-wasm-simd-threaded.jsep.wasm' -delete
          test -s vendor/nabra-tts.bundle.js
          test -s vendor/ort/ort-wasm-simd-threaded.jsep.mjs
          test -s vendor/ort/ort-wasm-simd-threaded.jsep.wasm
          echo "Bundled TTS: $(wc -c < vendor/nabra-tts.bundle.js) bytes"
          echo "Required ONNX runtime assets: $(find vendor/ort -maxdepth 1 -type f | wc -l)"

      - name: Commit generated local runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/nabra-tts.bundle.js vendor/ort
          if git diff --cached --quiet; then
            echo "Local TTS assets are already up to date."
            exit 0
          fi
          git commit -m "Build local Arabic TTS runtime assets"
          git push
