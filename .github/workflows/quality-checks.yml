name: ZEREOS quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zereos-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app structure and inline JavaScript syntax
        run: |
          node scripts/qa.mjs
          node --check real-avatar-studio.js
          node --input-type=module --check < avatar-studio.js
          python -m py_compile avatar-engine/worker.py
